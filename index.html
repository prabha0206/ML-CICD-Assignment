<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML CI/CD Assignment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #222;
        }

        .info {
            margin: 20px 0;
            padding: 15px;
            background: #f0f3f6;
            border-radius: 10px;
            text-align: left;
        }

        .status {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Machine Learning CI/CD Pipeline</h1>

    <div class="info">
        <h3>ML Model</h3>
        <p>Logistic Regression</p>
    </div>

    <div class="info">
        <h3>Dataset</h3>
        <p>Iris Dataset</p>
    </div>

    <div class="info">
        <h3>Model Accuracy</h3>
        <p>Approximately 90% or higher</p>
    </div>

    <div class="info">
        <h3>CI/CD Status</h3>
        <p class="status">Successfully Deployed using GitHub Actions</p>
    </div>

</div>

</body>
</html>
